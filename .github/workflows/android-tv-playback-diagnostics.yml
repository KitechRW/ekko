name: Android TV Playback Diagnostics

on:
  push:
    branches: [fix/tv-playback-diagnostics]
    paths:
      - "apps/tv/**"
      - ".github/workflows/android-tv-playback-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble overlay-free diagnostic APK
        run: gradle --project-dir apps/tv -PEKKO_TV_DIAGNOSTICS=true :app:assembleDebug
      - name: Upload diagnostic APK (not production)
        uses: actions/upload-artifact@v4
        with:
          name: Ekko-TV-playback-diagnostic
          path: apps/tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
