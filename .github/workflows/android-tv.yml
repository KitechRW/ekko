name: Android TV

on:
  pull_request:
    paths:
      - "apps/tv/**"
      - ".github/workflows/android-tv.yml"
  push:
    branches: [main]
    paths:
      - "apps/tv/**"
      - ".github/workflows/android-tv.yml"

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble Android TV APK
        run: gradle --project-dir apps/tv :app:assembleDebug
